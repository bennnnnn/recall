[project]
name = "recall-api"
version = "0.1.0"
description = "Recall personal AI chat backend"
readme = "README.md"
# Lower bound is 3.12.4, not 3.12: CPython 3.12.3 segfaults in the compiler
# while byte-compiling app/tests/modules/chat/test_chat.py, so the whole backend
# test suite dies with "Fatal Python error: Segmentation fault" during
# collection and no usable error. 3.12.4 and later compile it fine. CI happens
# to resolve a good interpreter, so this only ever bit a machine that landed on
# 3.12.3 — hence the explicit floor rather than a comment nobody reads.
requires-python = ">=3.12.4,<3.14"
# Upper bounds match the pattern already used for mypy/ruff: allow patch/minor
# within the locked band, block silent major/tooling jumps that break CI.
# Exact versions live in uv.lock (frozen install in CI).
dependencies = [
    "alembic>=1.19.1,<1.21",
    "asyncpg>=0.30.0,<0.33",
    "ddgs>=9.14.4,<10",
    "fastapi>=0.141.1,<0.143",
    "google-auth>=2.56.3,<2.63",
    "httpx>=0.28.0,<0.29",
    "litellm>=1.55.0,<1.106",
    "pydantic-settings>=2.6.0,<2.16",
    "pyjwt>=2.14.0,<2.16",
    "redis>=5.2.0,<8.2",
    "sqlalchemy[asyncio]>=2.0.52,<2.2",
    "uvicorn[standard]>=0.51.0,<0.55",
    "websockets>=17.1,<18",
    "pypdf>=5.1.0,<6.22",
    "python-docx>=1.1.0,<1.3",
    "openpyxl>=3.1.5,<3.2",
    "python-pptx>=1.0.2,<1.1",
    "defusedxml>=0.7.1,<0.8",
    "python-multipart>=0.0.20,<0.0.33",
    "pgvector>=0.5.0,<0.6",
    "sympy>=1.13.0,<1.15",
    "numpy>=2.5.2,<2.6",
    "pint>=0.24,<0.27",
    "rdkit>=2024.3.6,<2025",
    "cryptography>=50.0.0,<51",
    "boto3>=1.35.0,<1.44",
    "sentry-sdk[fastapi]>=2.66.0,<2.72",
    "pypdfium2>=4.30.0,<6",
    "pillow>=12.3.0,<14",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0,<2.41",
    "httpx>=0.28.0,<0.29",
    "hypothesis>=6.0,<7",
    "mypy>=2.3.0,<2.5",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=0.24.0,<1.5",
    "pytest-cov>=6.0.0,<8",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.8.0,<0.18",
]

[tool.uv]
# Transitive pins past Dependabot advisories (pyasn1 via google-auth;
# aiohttp via litellm; h2 via httpx[http2]/uvicorn).
override-dependencies = [
    "pyasn1>=0.6.4",
    "aiohttp>=3.14.3",
    "h2>=4.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
# Assertion rewriting is on: a failure shows the values that differed. Plain asserts
# worked around a collection segfault that was CPython 3.12.3 (see requires-python).
addopts = ["--import-mode=importlib"]
# A test that hangs fails after a minute, with every thread's stack, instead of holding
# CI until the job's limit (code-health audit TEST-09).
timeout = 60
# A coroutine nobody awaited, or an exception raised where nothing could catch it, is a
# bug the test would otherwise pass over.
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["UP", "I", "S", "E501"]
"app/tests/**" = ["S101", "S105", "S106", "RUF001", "RUF012", "E402", "E501"]
"app/routers/**" = ["B008", "E501"]
"app/modules/*/api.py" = ["B008", "E501"]
"app/modules/speech/realtime.py" = ["B008", "E501"]
"app/modules/*/models.py" = ["E501"]
"app/modules/*/schemas.py" = ["S105"]
"app/gateways/**" = ["S105", "E501"]
"app/gateways/storage_gateway.py" = ["S105", "S108"]
"app/models/orm/**" = ["E501"]
"app/modules/chat/**" = ["E501"]
"app/modules/turn_reading/**" = ["E501"]
"app/modules/chat/*_api.py" = ["B008", "E501"]
"app/modules/notifications/push.py" = ["RUF001", "RUF002", "RUF003"]
"app/modules/notifications/email_copy.py" = ["RUF001", "RUF002", "RUF003"]
"app/services/reminder_timing.py" = ["RUF001", "RUF002", "RUF003"]
# Writes the scanner reading in the glyphs students use (ℤ, ×, √).
"app/modules/math/reading.py" = ["RUF001", "RUF002", "RUF003"]
"app/modules/todos/**" = ["E501", "S101"]
"app/modules/web_search/*.py" = ["E501", "RUF002"]
"app/core/deps.py" = ["B008"]
"app/core/config.py" = ["S105"]
"app/core/settings/auth.py" = ["S105"]
"app/models/schemas/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["app"]
# A suppression that no longer suppresses anything is reported (code-health audit CLAR-06).
warn_unused_ignores = true

# Incremental strict: expand package by package. Do not flip global `strict` —
# in mypy <2.x, `strict = true` in overrides leaks globally. Use expanded
# --strict flags per module instead.
[[tool.mypy.overrides]]
module = [
    "app.core",
    "app.core.*",
    "app.exceptions",
    "app.models.schemas",
    "app.models.schemas.*",
    "app.modules.attachments.content",
    "app.modules.attachments.ocr",
    "app.modules.attachments.upload",
    "app.repositories",
    "app.repositories.*",
    "app.services.quota",
    "app.services.quota.*",
    "app.modules.billing",
    "app.modules.billing.*",
    "app.modules.todos",
    "app.modules.todos.*",
    "app.gateways",
    "app.gateways.*",
    "app.modules.memory",
    "app.modules.memory.*",
    "app.modules.chat",
    "app.modules.chat.*",
    "app.modules.conversation",
    "app.modules.conversation.*",
    "app.modules.turn_reading",
    "app.modules.turn_reading.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "alembic/*",
    # Scheduler boundary — covered via service-layer mocks.
    "app/background/push_scheduler.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
