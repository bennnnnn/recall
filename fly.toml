# Fly.io config for the Recall API.
# See the README "Production deployment (Fly.io)" section for the full setup.
#
# Two processes: `app` serves HTTP/WebSocket (PROCESS_ROLE=api); `worker` runs
# Redis-stream jobs + schedulers (PROCESS_ROLE=worker). Scale each independently.

app = "recall-api"
primary_region = "iad" # change to your region; Neon DB is in us-east-2

[build]
  context = "apps/api"
  dockerfile = "Dockerfile"

[env]
  PROCESS_ROLE = "api"
  # Keep a second LLM call out of normal time-to-first-token. Obvious current/
  # search intents still use the deterministic web-search gates and tool loop.
  WEB_SEARCH_CLASSIFIER_ENABLED = "false"
  # Semantic memory remains enabled, but a slow query-embedding provider must
  # fall back quickly to the type-priority memory block instead of holding TTFT.
  MEMORY_QUERY_EMBED_TIMEOUT_SECONDS = "0.75"
  # Fail a provider connection quickly enough for the existing model fallback
  # chain to help. Once streaming starts, 30s without any chunk is unhealthy.
  CHAT_STREAM_CONNECT_TIMEOUT_SECONDS = "5"
  CHAT_STREAM_TIMEOUT_SECONDS = "30"

# Run migrations once per deploy (not on every app machine boot).
[deploy]
  release_command = "/opt/venv/bin/alembic upgrade head"

[processes]
  # `exec` so uvicorn/worker is PID 1 and receives SIGTERM cleanly.
  app = "sh -c 'exec /opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log'"
  worker = "sh -c 'PROCESS_ROLE=worker exec /opt/venv/bin/python -m app.worker_main'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

# WebSocket support is on by default for HTTP services on Fly.
# Liveness: process up. Readiness: Postgres only (Redis blip must not drain
# the fleet). Worker is not covered by min_machines_running — pin it:
#   fly scale count worker=1
[[http_service.checks]]
  interval = "20s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[http_service.checks]]
  interval = "20s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health/ready"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]

# Worker is not an HTTP service, so min_machines_running does not apply.
# Always restart a crashed worker; keep count at 1 after deploy
# (`fly scale count worker=1`).
[[restart]]
  policy = "always"
  processes = ["worker"]

# Worker health check: the worker exposes a tiny /health/ready on port 8001
# (worker_health_port) so Fly can detect + restart a stuck worker whose event
# loop is blocked or whose job consumer has died — not just one that crashed.
[[checks]]
  name = "worker-health"
  port = 8001
  type = "http"
  interval = "20s"
  timeout = "5s"
  grace_period = "30s"
  path = "/health/ready"
  process = "worker"
