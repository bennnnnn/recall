name: Refresh Mobile Lockfile

on:
  push:
    branches:
      - fix/realtime-speech-rebuild
    paths:
      - ".github/workflows/refresh-mobile-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/realtime-speech-rebuild

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Refresh lockfile
        working-directory: apps/mobile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh mobile lockfile"
          git push origin HEAD:fix/realtime-speech-rebuild
