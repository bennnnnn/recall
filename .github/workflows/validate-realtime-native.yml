name: Validate Realtime Native Prebuild

on:
  push:
    branches:
      - fix/realtime-speech-rebuild
    paths:
      - ".github/workflows/validate-realtime-native.yml"

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Validate Expo config
        working-directory: apps/mobile
        run: pnpm exec expo config --type prebuild >/dev/null

      - name: Generate native projects
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --no-install --clean
