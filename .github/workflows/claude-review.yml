name: Claude Review

# Claude reviews a pull request when it gets the `review` label: one pass on Opus that reads
# the change and the code around it (read-only) and posts each problem as an inline comment
# from the Claude GitHub App, marked high, medium or low: a bug it can trigger with a
# concrete input or sequence, two paths that must agree and no longer do, code the change
# leaves dead, a test that cannot fail or misses the change, a doc sentence the change makes
# false, a CLAUDE.md or standards rule it breaks. It never approves, blocks or pushes, and it
# is not a required check. To review again, remove the label and add it back.
#
# 2026-11-01: it had been told to flag only logic wrong "whatever the input" and could read
# only the diff, so it passed edge-case bugs Copilot then found on #2178 (counts above 20,
# a 10^1000 overflow, a comma before "each"). It now names the input that breaks the code.
#
# 2026-11-06: the closing comment listed every function checked and every input tried, a
# long write-up mostly repeating the diff, paid for in output on the Claude plan. The
# checking stays; what it posts is the findings, each short, and one closing line.
#
# 2026-11-23: the main and only routine reviewer. Gemini on OpenRouter (openrouter-review.yml)
# cost too much per round, and on #2535 to #2555 it posted about ten times as many findings
# as this review did, roughly two in three real. The Sonnet prompt here ruled out dead code,
# weak tests, low-severity issues and anything the change did not create, so it passed what
# Gemini caught: a draft that jumps 44pt on the first key (#2551), a phone-only change the
# shared fixture never saw (#2553), a None content that crashed finalize (#2548), CLAUDE.md
# lines a deletion made false (#2549). It now runs Opus at high effort with a checklist for
# those (paths that must agree, dead code, tests, docs, text that arrives in pieces, caps,
# missing data), splits a big change across subagents, and reports low findings, marked.
# Measured on 8 pre-fix heads of 6 pull requests before the switch (PR #2556's body).
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (your Claude plan; create it with
# `claude setup-token`) or ANTHROPIC_API_KEY (billed per token). Until one is set, and on
# Dependabot and fork pull requests (which get no secrets), the steps skip.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# The label is in the key: the run for any other label (its job skipped) is made before its
# `if` is read, and in one group with a review it would cancel it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    # Each label's run is its own check: another label added later makes a skipped
    # "claude review (bug)" check, never one that hides the review's own result.
    name: claude review (${{ github.event.label.name }})
    if: ${{ github.event.label.name == 'review' }}
    runs-on: ubuntu-latest
    # Opus took 2 to 11 minutes a review when measured; a big change with subagents more.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Exchanged for the Claude GitHub App's token, which posts the comments.
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          # The whole history, so `git show <base>:<path>` reads a file before the change.
          fetch-depth: 0

      # Third-party code in a job that holds a model credential: pinned to a commit.
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        id: claude
        if: env.HAS_CLAUDE_AUTH == 'true'
        env:
          # The action stops at the first result: a subagent left running in the background
          # would end the review before it posts. This keeps every subagent in the foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }} once.
            You are its only reviewer: no other model reads it after you, so a real problem you
            leave out ships.

            Work through these steps in order; do not decide before step 6.

            1. Read the PR with `gh pr view` and `gh pr diff`; `git show
               ${{ github.event.pull_request.base.sha }}:<path>` gives a file before the change.
               Read the CLAUDE.md files in the directories above the changed files, and
               docs/ENGINEERING_STANDARDS.md.

            2. Split a big change. When the diff changes more than about 400 lines of code (tests,
               fixtures and docs not counted) or more than six code files, start one Task subagent
               per group of files that work together, two to four of them, all in one message and in
               the foreground (never run_in_background: the review ends when you first stop). Give
               each the diff command, its files and steps 3 to 6 of this list word for word, and ask
               it to return its findings, each with the input that triggers it, and to post nothing.
               Do steps 3 to 6 yourself on what joins the groups: the callers, shared fixtures, docs
               and tests. Then check each finding a subagent returns against the code yourself
               before you keep it.

            3. For EVERY function, component, rule, constant, style, fixture and test the diff adds,
               changes or deletes: Read its file in full with Read (not just the hunk), Grep for its
               callers and Read at least one, Read the functions it hands its input to, and Read the
               test that covers it. Find what produces its input in real use (the keys a keyboard
               sends, how a model's tokens split the text, what each caller passes) and use those
               inputs below. Use as many tool calls as the change needs.

            4. Try inputs. For each changed function, write down at least three inputs that stress it
               and work out from the code what each gives, against what it should give. Include each
               of these that applies:
               - text that arrives in pieces: feed a streaming or stateful function one piece at a
                 time and track its state after each; a piece that ends inside a word or a name
                 (every count of words, characters or lines then counts a word not yet finished), a
                 boundary inside a fence, a list, a link or an inline code span, a mark that arrives
                 before the one that closes it;
               - delimiters: the same character just inside and just outside a span, a fence or a
                 quote, and whether text outside the span is read as if it were inside; trailing
                 spaces, including LaTeX spaces (`\,`, `\;`, `\ `) and others the real producer
                 inserts; irregular or outdented markdown;
               - empty and first: empty input, the first key typed, the last one deleted, a list of
                 one; in UI, what mounts or unmounts when a value goes empty or non-empty, and
                 whether anything on screen moves;
               - caps: a count just over a limit, a backlog many times it, and what the next run or
                 turn then sees;
               - missing data: None, a missing key, a message with no content, a row the caller
                 leaves out, an object the caller passes as None;
               - order and repeats: a second call, a retry or regenerate, a cancelled task, two events
                 in the other order.

            5. Run each of these checks on the change, every time:
               a. Paths that must agree. List each pair the change touches that must give the same
                  answer: phone and server, the streamed text and the finished or saved text, a
                  shared fixture (docs/fixtures/) and the code on both sides of it, the live path and
                  an eval, sim or harness that models it, two copies of one check. Find an input on
                  which they now differ, or a side the change moved without the other (a fixture or
                  parity test not extended to the new behaviour).
               b. Dead code. Anything the change leaves unused or unreachable: a branch whose
                  condition can no longer hold, a style, constant, prop, import, helper or file
                  nothing reads any more.
               c. Tests. For each changed behaviour, name the test that would fail if the change were
                  reverted. Flag a test that cannot fail: its query can never match what it looks for
                  (read the component to see whether the thing queried is visible to that query at
                  all; React Native Testing Library skips an element hidden from accessibility unless
                  the query includes hidden elements), its assertion compares a value with one built
                  from it, or a mock stands in for the code under test. Flag a behaviour the PR says
                  it adds, removes or fixes that no assertion checks, including the wiring that turns
                  it on.
               d. Docs. Grep CLAUDE.md, FEATURES.md, docs/ and the comments and docstrings in the
                  code for the names, paths, routes, flags, constants and rules the change touches.
                  When the change adds or removes a file, module, route, flag, job or constant, also
                  go through each list in CLAUDE.md that names such things, entry by entry: the
                  domain catalog, the HTTP surfaces registered in main.py, the flags, the jobs, the
                  golden rules. For each file the change deletes, Grep those docs for its path, its
                  module and the plain name of what it served ("Math" for modules/math/api.py). Do
                  this check yourself, not in a subagent. Flag a sentence the change makes false.
               e. Rules. A CLAUDE.md or docs/ENGINEERING_STANDARDS.md rule the change breaks (quote
                  it), including the same logic written twice where one copy should serve both.

            6. Only then decide. Before you keep a finding, check that:
               - it is reachable: follow the triggering input from a real caller to the line; a
                 caller that always reshapes the input first makes it unreachable;
               - it belongs to this change: the change introduces it or makes it newly reachable. A
                 problem the base had in the same way is out, unless the change rewrites the function
                 that holds it or builds its new behaviour on top of it; then report it and say
                 "(was there before)";
               - it is not deliberate: read the comments beside the code, and any sibling test or
                 function that does the same thing; a looser form with a stated reason is a choice,
                 not a bug.

            Report a bug only when you can name a concrete input or sequence that triggers it; for the
            other checks, name the exact unused code, test, sentence or pair. Give each finding a
            severity:
               - high: loses or corrupts data, fails a request, a security hole, a wrong answer
                 shown as checked;
               - medium: a wrong result, a visible glitch or a broken behaviour a user can reach; two
                 paths that must agree and do not;
               - low: real but minor: dead code, a test that cannot fail or misses the change, a doc
                 sentence made false, a rare edge.
            Report the low ones too, but at most eight: when you have more, keep first those a user or
            the data would feel, then dead code and tests that cannot fail, then docs (CLAUDE.md
            first) and comments.

            Post each finding once with mcp__github_inline_comment__create_inline_comment
            (confirmed: true), in at most five short lines, starting with its severity in brackets
            ("[medium] ..."): the triggering input (or the exact code, test or sentence), what happens,
            what should happen, and the fix. Name code by its function or variable; do not paste or
            restate the code. Do not flag style, naming, wording, a test for code the pull request did
            not change, or anything lint, mypy or CI already catches.

            Steps 2 to 6 are your own working: keep them out of what you post. Finish with one
            `gh pr comment` that is exactly one line, "Claude review: N issues posted (high H,
            medium M, low L)." or "Claude review: no issues found." A review that did not read and
            try every changed function and run every check in step 5 is not a review.
          claude_args: >-
            --model opus --effort high --max-turns 200
            --allowedTools "Read,Grep,Glob,Task,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git show:*),Bash(git diff:*),Bash(git log:*)"

      # A green check must mean a review ran (2026-11-01). The action skips itself, and the
      # job would still pass, when this file on the pull request's branch differs from
      # main's; and with no credential (a fork or Dependabot pull request gets no secrets)
      # every step skips. Both fail here instead.
      - name: Fail when the review did not run
        if: ${{ !cancelled() && steps.claude.outputs.conclusion != 'success' }}
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          if [ "$HAS_CLAUDE_AUTH" != "true" ]; then
            echo "::error::Claude review did not run: no Claude credential here (a fork or Dependabot pull request gets no secrets, or CLAUDE_CODE_OAUTH_TOKEN is unset)."
          else
            echo "::error::Claude review did not run (conclusion: '${CONCLUSION:-skipped}'). If this branch is older than the last change to .github/workflows/claude-review.yml, merge main into it, then remove and re-add the review label."
          fi
          exit 1
