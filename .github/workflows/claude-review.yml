name: Claude Review

# Claude reviews each pull request when it is opened or marked ready and posts its
# findings as inline comments, as the Claude GitHub App (Anthropic's code-review
# plugin). It only comments: it never approves, blocks or pushes, and it is not a
# required check. The plugin skips drafts, trivial or automated pull requests, and
# any pull request Claude has already commented on; to ask again, re-run this job.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (your Claude plan; create it
# with `claude setup-token`) or ANTHROPIC_API_KEY (billed per token). Until one is
# set, and on Dependabot and fork pull requests (which get no secrets), the steps skip.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Exchanged for the Claude GitHub App's token, which posts the comments.
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1

      # Third-party code in a job that holds a model credential: pinned to a commit.
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
