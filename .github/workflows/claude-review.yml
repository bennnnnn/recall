name: Claude Review

# Claude reviews a pull request when it gets the `review` label: one pass on Sonnet that
# posts only problems it is sure of (code that will not run, logic that is clearly wrong,
# a security hole, a clear CLAUDE.md violation), as inline comments from the Claude GitHub
# App. It never approves, blocks or pushes, and it is not a required check. A Claude Code
# session reviews its own pull requests before it opens them; this is the opt-in pass for
# any other. To review again, remove the label and add it back.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (your Claude plan; create it with
# `claude setup-token`) or ANTHROPIC_API_KEY (billed per token). Until one is set, and on
# Dependabot and fork pull requests (which get no secrets), the steps skip.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# The label is in the key: the run for any other label (its job skipped) is made before its
# `if` is read, and in one group with a review it would cancel it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.label.name == 'review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Exchanged for the Claude GitHub App's token, which posts the comments.
      id-token: write
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          fetch-depth: 1

      # Third-party code in a job that holds a model credential: pinned to a commit.
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        if: env.HAS_CLAUDE_AUTH == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }} once.
            Read it with `gh pr view` and `gh pr diff`, and read the CLAUDE.md files in the
            directories above the changed files.

            Flag only problems you are sure of, in the changed lines:
            - code that will not run or parse (a wrong name, a missing import, a type error)
            - logic that gives a wrong result whatever the input
            - a security hole
            - a clear CLAUDE.md violation (quote the rule and link it)
            Do not flag style, naming, missing tests, nitpicks, problems that were there
            before this pull request, or anything a linter or CI catches. If you are not
            certain, leave it out.

            Post each problem once with mcp__github_inline_comment__create_inline_comment
            (confirmed: true): what is wrong and how to fix it. If there are none, post one
            comment with `gh pr comment`: "Claude review: no issues found."
          claude_args: >-
            --model sonnet --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
