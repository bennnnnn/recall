name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      # API tests read the fixtures it shares with the phone.
      - "docs/fixtures/**"
      - "scripts/check_file_sizes.py"
      - "scripts/file_size_baseline.json"
      - ".github/workflows/api-ci.yml"
  # Every pull request, so the required checks always report. The jobs skip
  # themselves when nothing they check changed (a skipped job counts as passed).
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - id: diff
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ -n "$PR" ] && files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only); then
            echo "$files" | grep -qE '^(apps/api/|docs/fixtures/|scripts/(check_file_sizes\.py|file_size_baseline\.json)$|\.github/workflows/api-ci\.yml$)' || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recall_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/recall_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check --diff .

      - name: File sizes
        run: python3 ../../scripts/check_file_sizes.py api

      - name: Mypy
        run: uv run mypy

      - name: Migrate test database
        run: uv run alembic upgrade head

      - name: Pytest
        env:
          VIRTUAL_ENV: ""
        run: |
          rm -rf .pytest_cache
          uv run pytest app/tests/services app/tests/repositories \
            --cov=app --cov-report=
          uv run pytest app/tests \
            --ignore=app/tests/services \
            --ignore=app/tests/repositories \
            --cov=app --cov-append --cov-report=term-missing --cov-fail-under=80

  # Validate the production image builds so a Dockerfile/dependency regression
  # surfaces on the PR, not at deploy time. No push — build only. Layer cache
  # keeps it fast when only app code changed (the deps layer is cached).
  docker-build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build API image (no push)
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
